function latLngToVec3(lat,lng,r) {
  const phi=(90-lat)*Math.PI/180, theta=(lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}

function getAge(birthYear, birthMonth, birthDay) {
  const now=new Date(); let age=now.getFullYear()-birthYear;
  const m=now.getMonth()+1, d=now.getDate();
  if(m<birthMonth||(m===birthMonth&&d<birthDay)) age--;
  return age;
}
function isBirthdayToday(birthMonth, birthDay) {
  const now=new Date(); return (now.getMonth()+1)===birthMonth&&now.getDate()===birthDay;
}
function daysUntil(birthYear,birthMonth,birthDay) {
  const now=new Date(); const next=new Date(now.getFullYear(),birthMonth-1,birthDay);
  if(now>next) next.setFullYear(next.getFullYear()+1);
  return Math.ceil((next-now)/86400000);
}
function getOrdinal(n){ const s=['th','st','nd','rd'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }

function getYearRanges(birthYear, currentAge) {
  const ranges=[]; const startAge=20;
  for(let a=startAge;a<=currentAge;a++){ const y1=birthYear+a, y2=birthYear+a+1; ranges.push({age:a,nextAge:a+1,year1:y1,year2:y2,key:`${a}-${a+1}`}); }

    blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,
  }); starField=new THREE.Points(sGeom,starMat); scene.add(starField);

  for(let i=0;i<5;i++){ const g=new THREE.BufferGeometry(); const p=new Float32Array(6); p[0]=(Math.random()-0.5)*10; p[1]=(Math.random()-0.5)*10; p[2]=(Math.random()-0.5)*8; p[3]=p[0]+(Math.random()-0.5)*4; p[4]=p[1]+(Math.random()-0.5)*4; p[5]=p[2]+(Math.random()-0.5)*4; g.setAttribute('position',new THREE.BufferAttribute(p,3)); const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:new THREE.Color(t.light),transparent:true,opacity:0})); l.visible=false; shootingStars.push({line:l,life:0,maxLife:0,vel:new THREE.Vector3()}); scene.add(l); }

  for(let i=0;i<12;i++){ const hc=document.createElement('canvas'); hc.width=hc.height=32; const hctx=hc.getContext('2d'); hctx.font='20px serif'; hctx.textAlign='center'; hctx.textBaseline='middle'; hctx.fillText('💖',16,16); const hMat=new THREE.SpriteMaterial({map:new THREE.CanvasTexture(hc),transparent:true,blending:THREE.AdditiveBlending,depthTest:true}); const hSpr=new THREE.Sprite(hMat); hSpr.scale.set(0.15,0.15,1); heartOrbits.push({sprite:hSpr,radius:1.7+i*0.08,speed:0.2+Math.random()*0.4,phase:Math.random()*Math.PI*2,tilt:(Math.random()-0.5)*1.2,yOffset:(Math.random()-0.5)*0.8}); globeGroup.add(hSpr); }

  constellationLines=new THREE.Group(); globeGroup.add(constellationLines);

  CONTINENT_POINTS.forEach(cont=>{ const pts=cont.points.map(p=>latLngToVec3(p.lat,p.lng,1.51)); pts.push(pts[0].clone()); globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:new THREE.Color(t.primary),transparent:true,opacity:0.25}))); });

  spriteGroup=new THREE.Group(); globeGroup.add(spriteGroup);

  scene.add(new THREE.AmbientLight(0x444466,1.2));
  const sun=new THREE.DirectionalLight(new THREE.Color(t.light),2.5); sun.position.set(5,3,5); scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x8866aa,0.8).position.set(-3,-1,-2));
  const bl=new THREE.PointLight(new THREE.Color(t.primary),2.5,8); bl.position.set(0,0,-4); scene.add(bl);

  renderer.domElement.addEventListener('pointerdown',onPD);
  renderer.domElement.addEventListener('pointermove',onPM);
  window.addEventListener('pointerup',onPU);
  renderer.domElement.addEventListener('click',onTap);
  renderer.domElement.style.touchAction='none';
  window.addEventListener('resize',onResize);
  animate();
}

function onPD(e){ e.preventDefault(); isDragging=true; autoRotate=false; totalDrag=0; const p=e.touches?e.touches[0]:e; dragStart.x=prevMouse.x=p.clientX; dragStart.y=prevMouse.y=p.clientY; if(e.touches&&e.touches.length===2){ pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); pinchStartZ=camera.position.z; } }
function onPM(e){ e.preventDefault(); if(!isDragging) return; if(e.touches&&e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); camera.position.z=Math.max(2.5,Math.min(8,pinchStartZ*pinchStartDist/Math.max(d,0.1))); return; } const p=e.touches?e.touches[0]:e; const dx=p.clientX-prevMouse.x, dy=p.clientY-prevMouse.y; totalDrag+=Math.abs(dx)+Math.abs(dy); rotVel.x=dy*0.005; rotVel.y=dx*0.005; globeGroup.rotation.x+=rotVel.x; globeGroup.rotation.y+=rotVel.y; prevMouse.x=p.clientX; prevMouse.y=p.clientY; }
function onPU(e){ e.preventDefault(); if(totalDrag<5) isDragging=false; else setTimeout(()=>{autoRotate=true;},2000); }
function onResize(){ const w=document.getElementById('globe-container').clientWidth, h=document.getElementById('globe-container').clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }

function onTap(e){
  if(isDragging||totalDrag>=5) return;
  const mx=(e.clientX/window.innerWidth)*2-1, my=-(e.clientY/window.innerHeight)*2+1;
  const rc=new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(mx,my),camera);
  const hits=rc.intersectObjects(spriteGroup.children,true);
  if(hits.length>0){ let obj=hits[0].object; while(obj){ if(obj.userData&&obj.userData.photoId){ showPhoto(obj.userData.photoId); return; } obj=obj.parent; } }
}

function createPhotoSprite(photo){
  const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d');
  const img=new Image();
  img.onload=()=>{
    ctx.beginPath(); ctx.arc(32,32,28,0,Math.PI*2); ctx.clip(); ctx.drawImage(img,0,0,64,64);
    ctx.beginPath(); ctx.arc(32,32,28,0,Math.PI*2); ctx.lineWidth=2.5; ctx.strokeStyle=theme.primary; ctx.stroke();
    const tex=new THREE.CanvasTexture(c);
    const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:true}));
    sprite.scale.set(0.18,0.18,1); sprite.position.copy(latLngToVec3(photo.lat,photo.lng,BASE_RADIUS)); sprite.userData={photoId:photo.id};
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.08,8),new THREE.MeshBasicMaterial({color:new THREE.Color(theme.primary)}));
    const inner=latLngToVec3(photo.lat,photo.lng,BASE_RADIUS-0.07), outer=latLngToVec3(photo.lat,photo.lng,BASE_RADIUS);
    pole.position.copy(inner.add(outer).multiplyScalar(0.5)); pole.lookAt(outer); pole.rotateX(Math.PI/2); pole.userData={photoId:photo.id};
    const aura=new THREE.Mesh(new THREE.RingGeometry(0.095,0.105,32),new THREE.MeshBasicMaterial({color:new THREE.Color(theme.primary),side:THREE.DoubleSide,transparent:true,opacity:0.6}));
    aura.position.copy(latLngToVec3(photo.lat,photo.lng,BASE_RADIUS+0.01)); aura.lookAt(new THREE.Vector3(0,0,0)); aura.userData={photoId:photo.id,isAura:true};
    spriteGroup.add(pole); spriteGroup.add(sprite); spriteGroup.add(aura); photoSprites.push({sprite,pole,aura,id:photo.id});
  };
  img.src=photo.data_url;
}

function clearSprites(){
  while(spriteGroup.children.length>0){ const c=spriteGroup.children[0]; if(c.material&&c.material.map) c.material.map.dispose(); if(c.material) c.material.dispose(); spriteGroup.remove(c); }
  photoSprites=[];
}
function drawConstellationLines(photos){
  while(constellationLines.children.length>0){ const c=constellationLines.children[0]; if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); constellationLines.remove(c); }
  if(!photos||photos.length<2) return;
  const byCont={}; photos.forEach(p=>{ const cont=p.continent||'unknown'; if(!byCont[cont]) byCont[cont]=[]; byCont[cont].push(p); });
  Object.values(byCont).forEach(group=>{ for(let i=0;i<group.length;i++){ for(let j=i+1;j<group.length;j++){ const da=group[i].lat-group[j].lat, db=group[i].lng-group[j].lng; if(Math.sqrt(da*da+db*db)<18){ const a=latLngToVec3(group[i].lat,group[i].lng,BASE_RADIUS+0.02), b=latLngToVec3(group[j].lat,group[j].lng,BASE_RADIUS+0.02); const mid=a.clone().add(b).multiplyScalar(0.5); const cp=mid.clone().normalize().multiplyScalar(BASE_RADIUS+0.12); const curve=new THREE.QuadraticBezierCurve3(a,cp,b); constellationLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(16)),new THREE.LineBasicMaterial({color:new THREE.Color(theme.primary),transparent:true,opacity:0.2}))); } } } });
}
async function reloadPhotos(){ clearSprites(); const photos=await fetchPhotos(globe.id,currentYearKey); photos.forEach(p=>createPhotoSprite(p)); drawConstellationLines(photos); document.getElementById('memory-count').textContent=photoSprites.length+(photoSprites.length===1?' memory':' memories'); }

function showPhoto(id){ fetchPhotos(globe.id,currentYearKey).then(photos=>{ const p=photos.find(x=>x.id===id); if(p){ document.getElementById('photo-full').src=p.data_url; document.getElementById('photo-modal').classList.add('show'); } }); }

function animate(){
  requestAnimationFrame(animate);
  oceanTime+=0.016;
  if(oceanParticles) oceanParticles.material.uniforms.uTime.value=oceanTime;
  if(starMat) starMat.uniforms.uTime.value=oceanTime;
  shootingStars.forEach(ss=>{
    if(ss.life>0){ ss.life-=0.016; const prog=ss.life/ss.maxLife; ss.line.material.opacity=prog*0.7; const pos=ss.line.geometry.attributes.position; for(let i=0;i<2;i++) pos.setXYZ(i,pos.getX(i)+ss.vel.x*0.016,pos.getY(i)+ss.vel.y*0.016,pos.getZ(i)+ss.vel.z*0.016); pos.needsUpdate=true; if(ss.life<=0){ ss.line.visible=false; ss.line.material.opacity=0; } }
    else if(Math.random()<0.005){ const start=new THREE.Vector3((Math.random()-0.5)*12,(Math.random()-0.5)*8,(Math.random()-0.5)*10); const dir=new THREE.Vector3((Math.random()-0.5)*4,(Math.random()-0.5)*4,(Math.random()-0.5)*4); ss.vel.copy(dir.clone().normalize().multiplyScalar(8+Math.random()*12)); ss.maxLife=1+Math.random()*2; ss.life=ss.maxLife; const pos=ss.line.geometry.attributes.position; pos.setXYZ(0,start.x,start.y,start.z); pos.setXYZ(1,start.x+dir.x,start.y+dir.y,start.z+dir.z); pos.needsUpdate=true; ss.line.visible=true; ss.line.material.opacity=0.7; }
  });
  heartOrbits.forEach(h=>{ h.phase+=h.speed*0.016; const x=Math.cos(h.phase)*h.radius, z=Math.sin(h.phase)*h.radius, y=Math.sin(h.phase*2+h.tilt)*h.yOffset; h.sprite.position.set(x,y,z); h.sprite.material.opacity=0.3+Math.sin(h.phase*2)*0.2; });
  if(autoRotate&&!isDragging){ globeGroup.rotation.y+=AUTO_ROTATE_SPEED; rotVel.x*=0.95; rotVel.y*=0.95; }
  else if(!isDragging){ if(Math.abs(rotVel.x)>0.0001||Math.abs(rotVel.y)>0.0001){ globeGroup.rotation.x+=rotVel.x; globeGroup.rotation.y+=rotVel.y; rotVel.x*=0.95; rotVel.y*=0.95; } }
  renderer.render(scene,camera);
}

document.getElementById('modal-close-btn').addEventListener('click',()=>{ document.getElementById('photo-modal').classList.remove('show'); });

async function init(){
  const slug = window.location.pathname.replace(/^\//,'').replace(/\/$/,'') || 'default';
  
  globe = await fetchGlobe(slug);
  if(!globe) { document.getElementById('loading-screen').classList.add('done'); document.getElementById('not-found').classList.add('show'); return; }
  
  theme = THEMES[globe.theme] || THEMES.pink;
  
  window.document.documentElement.style.setProperty('--pink', theme.primary);
  window.document.documentElement.style.setProperty('--pink-light', theme.light);
  window.document.documentElement.style.setProperty('--pink-dark', theme.dark);
  
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme.primary);
  document.getElementById('by-line').textContent = `Best Wishes From ${globe.creator_name}`;
  document.getElementById('my-world-text').textContent = 'My World';
  
  const age = getAge(globe.birth_year, globe.birth_month, globe.birth_day);
  const isBirthday = isBirthdayToday(globe.birth_month, globe.birth_day);
  const daysLeft = daysUntil(globe.birth_year, globe.birth_month, globe.birth_day);
  const card = document.getElementById('birthday-card');
  
  if(isBirthday) {
    card.innerHTML = `<div class="confetti-row">🎉🎂🎉</div><div class="birthday-title">Happy ${age}${getOrdinal(age)} Birthday, ${globe.partner_name}!</div><div class="birthday-sub">${globe.custom_message||'You are the best thing that ever happened to me.'}</div><div class="confetti-row">🎈💝🎈</div>`;
  } else {
    card.innerHTML = `<div class="age-text">${globe.partner_name}, you're ${age} and you're everything.</div><div class="countdown-text">${daysLeft} days until your ${age+1}${getOrdinal(age+1)} birthday 💕</div>`;
  }
  
  document.getElementById('globe-partner-name').textContent = `${globe.partner_name}'s World`;
  
  currentYearKey = `${age}-${age+1}`;
  const ranges = getYearRanges(globe.birth_year, age);
  const select = document.getElementById('year-select');
  select.innerHTML = '';
  ranges.forEach(r => { const opt = document.createElement('option'); opt.value = r.key; opt.textContent = `${r.age} → ${r.nextAge} (${r.year1}-${r.year2})`; if(r.key === currentYearKey) opt.selected = true; select.appendChild(opt); });
  select.addEventListener('change', async (e) => { currentYearKey = e.target.value; await reloadPhotos(); });
  
  document.getElementById('loading-screen').classList.add('done');
  
  document.getElementById('continue-btn').addEventListener('click', () => {
    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('globe-screen').classList.add('visible');
    createGlobe();
    reloadPhotos();
  });
}

init();

function initSparkles(){
  const canvas=document.getElementById('sparkles-canvas'), ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const particles=[];
  for(let i=0;i<80;i++) particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+0.5,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,a:Math.random()*0.6+0.2});
  (function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0; if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=`rgba(${parseInt(theme?theme.light.slice(1,3)||'FF':255,16)},${parseInt(theme?theme.light.slice(3,5)||'182':255,16)},${parseInt(theme?theme.light.slice(5,7)||'193':255,16)},${p.a})`; ctx.fill(); }); requestAnimationFrame(draw); })();
}
initSparkles();
</script>
