  html, body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--white); }

const BIRTH_DAY = 23;
const BIRTH_MONTH = 5;
const BIRTH_YEAR = 2006;

function getAge() {
  const now = new Date();
  let age = now.getFullYear() - BIRTH_YEAR;
  const m = now.getMonth() + 1;
  const d = now.getDate();
  if (m < BIRTH_MONTH || (m === BIRTH_MONTH && d < BIRTH_DAY)) age--;
  return age;
}

function isBirthdayToday() {
  const now = new Date();
  return (now.getMonth() + 1) === BIRTH_MONTH && now.getDate() === BIRTH_DAY;
}

function daysUntilBirthday() {
  const now = new Date();
  const next = new Date(now.getFullYear(), BIRTH_MONTH - 1, BIRTH_DAY);
  if (now > next) next.setFullYear(next.getFullYear() + 1);
  return Math.ceil((next - now) / 86400000);
}

function getOrdinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return s[(v - 20) % 10] || s[v] || s[0];
}

function getYearRanges() {
  const age = getAge();
  const ranges = [];
  const startAge = 20;
  for (let a = startAge; a <= age; a++) {
    const y1 = BIRTH_YEAR + a;
    const y2 = BIRTH_YEAR + a + 1;
    ranges.push({ age: a, nextAge: a + 1, year1: y1, year2: y2, key: `${a}-${a + 1}` });
  }
  ranges.reverse();
  return ranges;
}

function getCurrentYearKey() {
  const age = getAge();
  return `${age}-${age + 1}`;
}

function randOnContour(continent) {
  const pts = continent.points;
  const i = Math.floor(Math.random() * pts.length);
  const a = pts[i];
  const b = pts[(i + 1) % pts.length];
  const t = Math.random();
  const jitter = () => (Math.random() - 0.5) * 2.5;
  return {
    lat: a.lat + (b.lat - a.lat) * t + jitter(),
    lng: a.lng + (b.lng - a.lng) * t + jitter(),
    continent: continent.name,
  };
}

function latLngToVec3(lat, lng, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

function createGlobe() {
  scene = new THREE.Scene();
  const w = globeContainer.clientWidth;
  const h = globeContainer.clientHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.z = 4.5;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x1a001a, 1);
  globeContainer.appendChild(renderer.domElement);

  globeGroup = new THREE.Group();
  scene.add(globeGroup);

  const darkPink = new THREE.Color('#C71585');
  const lightPink = new THREE.Color('#FFB6C1');

  const geom = new THREE.SphereGeometry(1.5, 128, 128);
  const pos = geom.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = (y + 1.5) / 3;
    const c = new THREE.Color().lerpColors(darkPink, lightPink, t);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 30, specular: new THREE.Color('#FF69B4'), transparent: true, opacity: 0.9 });
  globeGroup.add(new THREE.Mesh(geom, mat));

  const atmosGeom = new THREE.SphereGeometry(1.58, 64, 64);
  const atmosMat = new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vN; void main(){ float i=pow(0.7-dot(vN,vec3(0,0,1)),3.0); gl_FragColor=vec4(1.0,0.42,0.71,i*0.6); }`,
    blending: THREE.AdditiveBlending, side: THREE.FrontSide, transparent: true, depthWrite: false,
  });
  globeGroup.add(new THREE.Mesh(atmosGeom, atmosMat));

  const gridG = new THREE.SphereGeometry(1.503, 48, 24);
  const gridM = new THREE.MeshBasicMaterial({ color: 0xFF69B4, wireframe: true, transparent: true, opacity: 0.05 });
  globeGroup.add(new THREE.Mesh(gridG, gridM));

  const ringG = new THREE.TorusGeometry(1.53, 0.005, 16, 100);
  const ringM = new THREE.MeshBasicMaterial({ color: 0xFFB6C1, transparent: true, opacity: 0.3 });
  const r1 = new THREE.Mesh(ringG, ringM);
  const r2 = new THREE.Mesh(ringG, ringM);
  r2.rotation.x = Math.PI / 2;
  globeGroup.add(r1);
  globeGroup.add(r2);

  const oceanCount = 3000;
  const oGeom = new THREE.BufferGeometry();
  const oPos = new Float32Array(oceanCount * 3);
  const oRand = new Float32Array(oceanCount);
  for (let i = 0; i < oceanCount; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = 1.505 + Math.random() * 0.08;
    oPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    oPos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    oPos[i * 3 + 2] = r * Math.cos(ph);
    oRand[i] = Math.random() * Math.PI * 2;
  }
  oGeom.setAttribute('position', new THREE.BufferAttribute(oPos, 3));
  oGeom.setAttribute('phase', new THREE.BufferAttribute(oRand, 1));
  const oMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor1: { value: new THREE.Color('#FF69B4') }, uColor2: { value: new THREE.Color('#FFF0F5') } },
    vertexShader: `attribute float phase; varying float vPhase; varying vec3 vPos; void main(){ vec4 mp=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mp; vPhase=phase; vPos=position; gl_PointSize=2.5; }`,
    fragmentShader: `varying float vPhase; varying vec3 vPos; uniform float uTime; uniform vec3 uColor1; uniform vec3 uColor2; void main(){ float d=length(gl_PointCoord-vec2(0.5))*2.0; if(d>1.0) discard; float sparkle=smoothstep(0.8,0.0,d)*0.9; float twinkle=sin(vPhase+uTime*2.0)*0.5+0.5; float alpha=sparkle*(0.3+twinkle*0.7); vec3 col=mix(uColor1,uColor2,twinkle); gl_FragColor=vec4(col,alpha); }`,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
  oceanParticles = new THREE.Points(oGeom, oMat);
  globeGroup.add(oceanParticles);

  shootingStars = [];
  heartOrbits = [];
  constellationLines = null;

  const starGeom = new THREE.BufferGeometry();
const farStarCount = 1200;
const farStarPos = new Float32Array(farStarCount * 3);
const farStarPhase = new Float32Array(farStarCount);
for (let i = 0; i < farStarCount; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r = 7 + Math.random() * 14;
  farStarPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
  farStarPos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
  farStarPos[i * 3 + 2] = r * Math.cos(ph);
  farStarPhase[i] = Math.random() * Math.PI * 2;
}
starGeom.setAttribute('position', new THREE.BufferAttribute(farStarPos, 3));
starGeom.setAttribute('phase', new THREE.BufferAttribute(farStarPhase, 1));
starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `attribute float phase; varying float vP; varying vec3 vPos; void main(){ vec4 mp=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mp; vP=phase; vPos=position; gl_PointSize=1.5+sin(phase)*0.8; }`,
  fragmentShader: `varying float vP; varying vec3 vPos; uniform float uTime; void main(){ float d=length(gl_PointCoord-vec2(0.5))*2.0; if(d>1.0) discard; float t=sin(vP+uTime*1.3)*0.5+0.5; float a=(1.0-d)*0.6*(0.3+t*0.7); vec3 col=mix(vec3(0.8,0.5,0.9),vec3(1.0,0.85,0.95),t); gl_FragColor=vec4(col,a); }`,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
});
starField = new THREE.Points(starGeom, starMat);
scene.add(starField);

  scene.add(new THREE.AmbientLight(0x444466, 1.2));
  const sun = new THREE.DirectionalLight(0xffccdd, 2.5);
  sun.position.set(5, 3, 5);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8866aa, 0.8);
  fill.position.set(-3, -1, -2);
  scene.add(fill);
  const backLight = new THREE.PointLight(0xFF69B4, 2.5, 8);
  backLight.position.set(0, 0, -4);
  scene.add(backLight);

  for (let i = 0; i < 5; i++) {
    const g = new THREE.BufferGeometry();
    const p = new Float32Array(6);
    p[0] = (Math.random() - 0.5) * 10;
    p[1] = (Math.random() - 0.5) * 10;
    p[2] = (Math.random() - 0.5) * 8;
    p[3] = p[0] + (Math.random() - 0.5) * 4;
    p[4] = p[1] + (Math.random() - 0.5) * 4;
    p[5] = p[2] + (Math.random() - 0.5) * 4;
    g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xFFB6C1, transparent: true, opacity: 0 }));
    line.visible = false;
    shootingStars.push({ line, life: 0, maxLife: 0, vel: new THREE.Vector3() });

  }

  for (let i = 0; i < 12; i++) {
    const hSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: (() => {

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💖', 16, 16);

      })(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthTest: true,
    }));
    hSprite.scale.set(0.15, 0.15, 1);
    const orbitR = 1.7 + i * 0.08;
    const orbitSpeed = 0.2 + Math.random() * 0.4;
    const orbitPhase = Math.random() * Math.PI * 2;
    const orbitTilt = (Math.random() - 0.5) * 1.2;
    heartOrbits.push({ sprite: hSprite, radius: orbitR, speed: orbitSpeed, phase: orbitPhase, tilt: orbitTilt, yOffset: (Math.random() - 0.5) * 0.8 });
    globeGroup.add(hSprite);
  }

  constellationLines = new THREE.Group();
  globeGroup.add(constellationLines);

  drawContinentWireframes();

  spriteGroup = new THREE.Group();
  globeGroup.add(spriteGroup);

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

function drawContinentWireframes() {
  CONTINENT_POINTS.forEach(cont => {
    const pts3d = cont.points.map(p => latLngToVec3(p.lat, p.lng, 1.51));
    pts3d.push(pts3d[0].clone());
    const lineGeom = new THREE.BufferGeometry().setFromPoints(pts3d);
    const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xFF69B4, transparent: true, opacity: 0.25, linewidth: 1 }));
    globeGroup.add(line);
  });
}

function drawConstellationLines(photos) {
  while (constellationLines.children.length > 0) {
    const c = constellationLines.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    constellationLines.remove(c);
  }
  if (!photos || photos.length < 2) return;
  const byContinent = {};
  photos.forEach(p => {
    const cont = p.continent || 'unknown';
    if (!byContinent[cont]) byContinent[cont] = [];
    byContinent[cont].push(p);
  });
  Object.values(byContinent).forEach(group => {
    for (let i = 0; i < group.length; i++) {
      for (let j = i + 1; j < group.length; j++) {
        const dlat = group[i].lat - group[j].lat;
        const dlng = group[i].lng - group[j].lng;
        const dist = Math.sqrt(dlat * dlat + dlng * dlng);
        if (dist < 18) {
          const a = latLngToVec3(group[i].lat, group[i].lng, BASE_RADIUS + 0.02);
          const b = latLngToVec3(group[j].lat, group[j].lng, BASE_RADIUS + 0.02);
          const mid = a.clone().add(b).multiplyScalar(0.5);
          const cp = mid.clone().normalize().multiplyScalar(BASE_RADIUS + 0.12);
          const curve = new THREE.QuadraticBezierCurve3(a, cp, b);
          const pts = curve.getPoints(16);
          const lGeom = new THREE.BufferGeometry().setFromPoints(pts);
          const line = new THREE.Line(lGeom, new THREE.LineBasicMaterial({ color: 0xFF69B4, transparent: true, opacity: 0.2 }));
          constellationLines.add(line);
        }
      }
    }
  });
}

function createPhotoSprite(photo) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.beginPath();
    ctx.arc(32, 32, 28, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, 0, 0, 64, 64);
    ctx.beginPath();
    ctx.arc(32, 32, 28, 0, Math.PI * 2);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#FF69B4';
    ctx.stroke();

    const tex = new THREE.CanvasTexture(c);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true }));
    sprite.scale.set(0.18, 0.18, 1);
    const p = latLngToVec3(photo.lat, photo.lng, BASE_RADIUS);
    sprite.position.copy(p);
    sprite.userData = { photoId: photo.id };

    const poleG = new THREE.CylinderGeometry(0.012, 0.012, 0.08, 8);
    const pole = new THREE.Mesh(poleG, new THREE.MeshBasicMaterial({ color: 0xFF69B4 }));
    const inner = latLngToVec3(photo.lat, photo.lng, BASE_RADIUS - 0.07);
    const outer = latLngToVec3(photo.lat, photo.lng, BASE_RADIUS);
    pole.position.copy(inner.add(outer).multiplyScalar(0.5));
    pole.lookAt(outer);
    pole.rotateX(Math.PI / 2);
    pole.userData = { photoId: photo.id };

    const auraG = new THREE.RingGeometry(0.095, 0.105, 32);
    const aura = new THREE.Mesh(auraG, new THREE.MeshBasicMaterial({ color: 0xFF69B4, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
    const ap = latLngToVec3(photo.lat, photo.lng, BASE_RADIUS + 0.01);
    aura.position.copy(ap);
    aura.lookAt(new THREE.Vector3(0, 0, 0));
    aura.userData = { photoId: photo.id, isAura: true };

    spriteGroup.add(pole);
    spriteGroup.add(sprite);
    spriteGroup.add(aura);
    photoSprites.push({ sprite, pole, aura, id: photo.id });
  };
  img.src = photo.dataUrl;
}

function clearSprites() {
  while (spriteGroup.children.length > 0) {
    const c = spriteGroup.children[0];
    if (c.material && c.material.map) c.material.map.dispose();
    if (c.material) c.material.dispose();
    spriteGroup.remove(c);
  }
  photoSprites = [];
}

async function reloadGlobePhotos() {
  clearSprites();
  const photos = await getPhotosByYear(currentYearKey);
  photos.forEach(p => createPhotoSprite(p));
  drawConstellationLines(photos);
  updateMemoryCount();
}

function updateMemoryCount() {
  document.getElementById('memory-count').textContent = photoSprites.length + (photoSprites.length === 1 ? ' memory' : ' memories');
}

function onTap(e) {
  if (isDragging || totalDrag >= 5) return;
  const mx = (e.clientX / window.innerWidth) * 2 - 1;
  const my = -(e.clientY / window.innerHeight) * 2 + 1;
  const rc = new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(mx, my), camera);
  const hits = rc.intersectObjects(spriteGroup.children, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj) {
      if (obj.userData && obj.userData.photoId) {
        viewingPhotoId = obj.userData.photoId;
        showPhotoModal(obj.userData.photoId);
        return;
      }
      obj = obj.parent;
    }
  }
}

function onPointerDown(e) {
  e.preventDefault();
  isDragging = true;
  autoRotate = false;
  totalDrag = 0;
  const p = e.touches ? e.touches[0] : e;
  dragStart.x = prevMouse.x = p.clientX;
  dragStart.y = prevMouse.y = p.clientY;
  if (e.touches && e.touches.length === 2) {
    pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    pinchStartZ = camera.position.z;
  }
}

function onPointerMove(e) {
  e.preventDefault();
  if (!isDragging) return;
  if (e.touches && e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    camera.position.z = Math.max(2.5, Math.min(8, pinchStartZ * pinchStartDist / Math.max(d, 0.1)));
    return;
  }
  const p = e.touches ? e.touches[0] : e;
  const dx = p.clientX - prevMouse.x, dy = p.clientY - prevMouse.y;
  totalDrag += Math.abs(dx) + Math.abs(dy);
  rotVel.x = dy * 0.005;
  rotVel.y = dx * 0.005;
  globeGroup.rotation.x += rotVel.x;
  globeGroup.rotation.y += rotVel.y;
  prevMouse.x = p.clientX;
  prevMouse.y = p.clientY;
}

function onPointerUp(e) {
  e.preventDefault();
  if (totalDrag < 5) isDragging = false;
  else setTimeout(() => { autoRotate = true; }, 2000);
}

function onResize() {
  const w = globeContainer.clientWidth, h = globeContainer.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function animate() {
  requestAnimationFrame(animate);
  oceanTime += 0.016;
  if (oceanParticles) oceanParticles.material.uniforms.uTime.value = oceanTime;
  if (starMat) starMat.uniforms.uTime.value = oceanTime;

  shootingStars.forEach(ss => {
    if (ss.life > 0) {
      ss.life -= 0.016;
      const prog = ss.life / ss.maxLife;
      ss.line.material.opacity = prog * 0.7;
      const pos = ss.line.geometry.attributes.position;
      for (let i = 0; i < 2; i++) {
        pos.setXYZ(i, pos.getX(i) + ss.vel.x * 0.016, pos.getY(i) + ss.vel.y * 0.016, pos.getZ(i) + ss.vel.z * 0.016);
      }
      pos.needsUpdate = true;
      if (ss.life <= 0) {
        ss.line.visible = false;
        ss.line.material.opacity = 0;
      }
    } else if (Math.random() < 0.005) {
      const start = new THREE.Vector3((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 10);
      const dir = new THREE.Vector3((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
      ss.vel.copy(dir.clone().normalize().multiplyScalar(8 + Math.random() * 12));
      ss.maxLife = 1 + Math.random() * 2;
      ss.life = ss.maxLife;
      const pos = ss.line.geometry.attributes.position;
      pos.setXYZ(0, start.x, start.y, start.z);
      pos.setXYZ(1, start.x + dir.x, start.y + dir.y, start.z + dir.z);
      pos.needsUpdate = true;
      ss.line.visible = true;
      ss.line.material.opacity = 0.7;
    }
  });

  heartOrbits.forEach(h => {
    h.phase += h.speed * 0.016;
    const x = Math.cos(h.phase) * h.radius;
    const z = Math.sin(h.phase) * h.radius;
    const y = Math.sin(h.phase * 2 + h.tilt) * h.yOffset;
    h.sprite.position.set(x, y, z);
    h.sprite.material.opacity = 0.3 + Math.sin(h.phase * 2) * 0.2;
  });

  if (autoRotate && !isDragging) {
    globeGroup.rotation.y += AUTO_ROTATE_SPEED;
    rotVel.x *= 0.95;
    rotVel.y *= 0.95;
  } else if (!isDragging) {
    if (Math.abs(rotVel.x) > 0.0001 || Math.abs(rotVel.y) > 0.0001) {
      globeGroup.rotation.x += rotVel.x;
      globeGroup.rotation.y += rotVel.y;
      rotVel.x *= 0.95;
      rotVel.y *= 0.95;
    }
  }
  renderer.render(scene, camera);
}

function showPhotoModal(id) {
  getPhotosByYear(currentYearKey).then(photos => {
    const p = photos.find(x => x.id === id);
    if (p) {
      viewingPhotoId = id;
      document.getElementById('photo-full').src = p.dataUrl;
      document.getElementById('photo-modal').classList.add('show');
      document.getElementById('delete-confirm').classList.remove('show');
    }
  });
}

async function handleDeletePhoto() {
  if (!viewingPhotoId) return;
  await deletePhoto(viewingPhotoId);
  document.getElementById('photo-modal').classList.remove('show');
  document.getElementById('delete-confirm').classList.remove('show');

  const idx = photoSprites.findIndex(s => s.id === viewingPhotoId);
  if (idx >= 0) {
    const { sprite, pole, aura } = photoSprites[idx];
    if (sprite.material && sprite.material.map) sprite.material.map.dispose();
    if (sprite.material) sprite.material.dispose();
    if (pole.material) pole.material.dispose();
    if (aura) { if (aura.material) aura.material.dispose(); spriteGroup.remove(aura); }
    spriteGroup.remove(sprite);
    spriteGroup.remove(pole);
    photoSprites.splice(idx, 1);
  }
  const remainingPhotos = await getPhotosByYear(currentYearKey);
  drawConstellationLines(remainingPhotos);
  updateMemoryCount();
  viewingPhotoId = null;
}

function resizeImage(file, maxW = 300) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(maxW / img.width, 1);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    lng: pos.lng,

    const opt = document.createElement('option');
    opt.value = r.key;
    opt.textContent = `${r.age} → ${r.nextAge} (${r.year1}-${r.year2})`;
    if (r.key === currentYearKey) opt.selected = true;
    select.appendChild(opt);
  });

  const age = getAge();
  const isBirthday = isBirthdayToday();
  const daysLeft = daysUntilBirthday();
  const card = document.getElementById('birthday-card');

  if (isBirthday) {
    card.innerHTML = `
      <div class="confetti-row">🎉🎂🎉</div>
      <div class="birthday-title">Happy ${age}${getOrdinal(age)} Birthday, Raisa!</div>
      <div class="birthday-sub">You are the best thing that ever happened to me.</div>
      <div class="confetti-row">🎈💝🎈</div>`;
  } else {
    card.innerHTML = `
      <div class="age-text">Raisa, you're ${age} and you're my everything.</div>
      <div class="countdown-text">${daysLeft} days until your ${age + 1}${getOrdinal(age + 1)} birthday 💕</div>`;
  }

  document.getElementById('continue-btn').addEventListener('click', async () => {
    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('globe-screen').classList.add('visible');
    createGlobe();
    await reloadGlobePhotos();
  });

init();

function initSparkles() {
  const canvas = document.getElementById('sparkles-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5 + 0.5, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, a: Math.random() * 0.6 + 0.2 });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,182,193,${p.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}
initSparkles();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
